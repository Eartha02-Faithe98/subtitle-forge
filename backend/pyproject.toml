[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "subtitle-forge-api"
version = "0.1.0"
description = "Local API foundation for Subtitle Forge"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.116,<1",
  "faster-whisper>=1.2.1,<2",
  "httpx>=0.28.1,<1",
  "numpy>=1.23,<2.5",
  "pydantic-settings>=2.10,<3",
  "python-multipart>=0.0.32,<1",
  "uvicorn[standard]>=0.35,<1",
  "yt-dlp>=2026.8.19,<2027",
]

[project.optional-dependencies]
dev = [
  "mypy>=1.17,<2",
  "pytest>=9.0.3,<10",
  "pytest-cov>=6.2,<8",
  "ruff>=0.12,<1",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
subtitle_forge_api = ["py.typed"]

[tool.pytest.ini_options]
addopts = "--strict-markers --strict-config"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["subtitle_forge_api"]
